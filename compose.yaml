# AST USERS SHOULD NOT MODIFY THIS FILE
# Custom user settings for individual services can be applied in the overides.yaml file (after running `make init`).
# Modifying this file may lead to merge conflicts for future updates.

# You can view the fully resolved config by running `docker compose config`.

# This section includes the base observability app components that make up the majority of AST.
# This includes self-monitoring for the observability stack, and base configurations for all components.
include:
  - path : 
      - AppFramework/stacks/observability-app/compose.yaml
      - override-app.yaml
      - override.yaml

services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883"     # MQTT (TCP)
      - "9001:9001"     # MQTT over WebSockets
    volumes:
      - ./services/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

