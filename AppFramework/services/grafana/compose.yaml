volumes:
  grafana: {}

services:
  grafana:
    image: grafana/grafana:latest-ubuntu
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/login"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor traceQLStreaming metricsSummary
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=motherduck-duckdb-datasource,grafana-mqtt-datasource
      - GF_INSTALL_PLUGINS=motherduck-duckdb-datasource,grafana-mqtt-datasource
    volumes:
      - grafana:/var/lib/grafana
      - ./config/provisioning/plugins/motherduck-duckdb-datasource:/var/lib/grafana/plugins/motherduck-duckdb-datasource
      - ./config/provisioning/plugins/grafana-mqtt-datasource:/var/lib/grafana/plugins/grafana-mqtt-datasource
      - /Users/c.hain/Projects/crossplane/otel-arrow/tools/pipeline_perf_test:/tmp/data
