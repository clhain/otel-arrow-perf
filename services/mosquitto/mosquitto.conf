# mosquitto.conf

# Allow anonymous connections (no username/password required)
allow_anonymous true

# ============================================================
# === Listener for TCP (MQTT over port 1883)
listener 1883
protocol mqtt

# ============================================================
# === Listener for WebSockets (MQTT over WebSockets on port 9001)
listener 9001
protocol websockets

# Optional: Set the maximum number of connections (default is unlimited)
# max_connections -1

# ============================================================
log_type error
log_type warning
log_type notice
log_type information

# ============================================================
# Persistence (optional)
persistence false